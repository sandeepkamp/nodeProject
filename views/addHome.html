<!DOCTYPE html> 
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Home</title>
  </head>
  <body>
    <h1>Add a New Home</h1>
    <form action="/host/add-home" method="POST">
      <label for="homeName">Home Name:</label><br>
      <input type="text" id="homeName" name="homeName" required><br><br>
      <label for="homeAddress">Home Address:</label><br>
      <input type="text" id="homeAddress" name="homeAddress" required><br><br>
      <input type="submit" value="Add Home">
    </form>
  </body>
